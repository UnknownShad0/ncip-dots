<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequential routing • one active office at a time</title><style>*{box-sizing:border-box}html,body{margin:0;width:1500px;height:430px;background:#f2f7f9;overflow:hidden}svg{display:block;width:1500px;height:430px}.title{font:700 27px Arial,sans-serif;fill:#123f59}.main{font:700 21px Arial,sans-serif;fill:#213746}.sub{font:500 17px Arial,sans-serif;fill:#5d7380}.edge{font:600 16px Arial,sans-serif;text-anchor:middle}.tag{font:700 13px Arial,sans-serif;fill:#fff}.note{font:500 16px Arial,sans-serif;fill:#5d7380}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#087f8c"/></marker></defs><rect width="100%" height="100%" fill="#f2f7f9"/><text x="750" y="39" text-anchor="middle" class="title">Sequential routing • one active office at a time</text><g><rect x="40" y="125" width="205" height="120" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="142.5" y="171.5" text-anchor="middle" dominant-baseline="middle" class="main">Current office</text><text x="142.5" y="198.5" text-anchor="middle" dominant-baseline="middle" class="sub">sends the record</text></g><g><path d="M245,185 L290,185" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="290" y="125" width="245" height="120" rx="17" fill="#e5f4ee" stroke="#123f59" stroke-width="2.6"/><rect x="302" y="135" width="82" height="25" rx="12" fill="#1b6680"/><text x="313" y="153" class="tag">ACTIVE</text><text x="412.5" y="158" text-anchor="middle" dominant-baseline="middle" class="main">1 • Office A</text><text x="412.5" y="185" text-anchor="middle" dominant-baseline="middle" class="sub">Receive → review</text><text x="412.5" y="212" text-anchor="middle" dominant-baseline="middle" class="sub">Approve to advance</text></g><g><path d="M535,185 L590,185" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="590" y="125" width="245" height="120" rx="17" fill="#fff2d7" stroke="#123f59" stroke-width="2.6"/><rect x="602" y="135" width="62" height="25" rx="12" fill="#1b6680"/><text x="613" y="153" class="tag">NEXT</text><text x="712.5" y="158" text-anchor="middle" dominant-baseline="middle" class="main">2 • Office B</text><text x="712.5" y="185" text-anchor="middle" dominant-baseline="middle" class="sub">Waits for Office A</text><text x="712.5" y="212" text-anchor="middle" dominant-baseline="middle" class="sub">then receives</text></g><g><path d="M835,185 L890,185" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="890" y="125" width="245" height="120" rx="17" fill="#fff2d7" stroke="#123f59" stroke-width="2.6"/><rect x="902" y="135" width="82" height="25" rx="12" fill="#1b6680"/><text x="913" y="153" class="tag">QUEUED</text><text x="1012.5" y="158" text-anchor="middle" dominant-baseline="middle" class="main">3 • Office C</text><text x="1012.5" y="185" text-anchor="middle" dominant-baseline="middle" class="sub">Activates after</text><text x="1012.5" y="212" text-anchor="middle" dominant-baseline="middle" class="sub">Office B approves</text></g><g><path d="M1135,185 L1190,185" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="1190" y="125" width="260" height="120" rx="17" fill="#e5f4ee" stroke="#123f59" stroke-width="2.6"/><text x="1320" y="171.5" text-anchor="middle" dominant-baseline="middle" class="main">All required steps</text><text x="1320" y="198.5" text-anchor="middle" dominant-baseline="middle" class="sub">approved → continue</text></g><path d="M715 245 L715 330 L790 330" fill="none" stroke="#a84450" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="790" y="300" width="385" height="72" rx="17" fill="#fae9eb" stroke="#123f59" stroke-width="2.6"/><text x="982.5" y="336" text-anchor="middle" dominant-baseline="middle" class="main">Change request or rejection pauses the route</text></g><text x="750" y="412" text-anchor="middle" class="note">Office order can be arranged before the route starts; recorded work remains in the history.</text></svg></body></html>
