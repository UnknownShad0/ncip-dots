<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOTS • complete system workflow</title><style>*{box-sizing:border-box}html,body{margin:0;width:1700px;height:820px;background:#f2f7f9;overflow:hidden}svg{display:block;width:1700px;height:820px}.title{font:700 27px Arial,sans-serif;fill:#123f59}.main{font:700 21px Arial,sans-serif;fill:#213746}.sub{font:500 17px Arial,sans-serif;fill:#5d7380}.edge{font:600 16px Arial,sans-serif;text-anchor:middle}.tag{font:700 13px Arial,sans-serif;fill:#fff}.note{font:500 16px Arial,sans-serif;fill:#5d7380}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#087f8c"/></marker></defs><rect width="100%" height="100%" fill="#f2f7f9"/><text x="850" y="39" text-anchor="middle" class="title">DOTS • complete system workflow</text><g><rect x="30" y="115" width="200" height="130" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="130" y="153" text-anchor="middle" dominant-baseline="middle" class="main">1 • Sign in</text><text x="130" y="180" text-anchor="middle" dominant-baseline="middle" class="sub">Account + role</text><text x="130" y="207" text-anchor="middle" dominant-baseline="middle" class="sub">+ office access</text></g><g><path d="M230,180 L270,180" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="270" y="115" width="220" height="130" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="380" y="153" text-anchor="middle" dominant-baseline="middle" class="main">2 • Prepare</text><text x="380" y="180" text-anchor="middle" dominant-baseline="middle" class="sub">Author in DOTS</text><text x="380" y="207" text-anchor="middle" dominant-baseline="middle" class="sub">or upload a file</text></g><g><path d="M490,180 L530,180" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="530" y="115" width="235" height="130" rx="17" fill="#e5f4ee" stroke="#123f59" stroke-width="2.6"/><text x="647.5" y="153" text-anchor="middle" dominant-baseline="middle" class="main">3 • Register</text><text x="647.5" y="180" text-anchor="middle" dominant-baseline="middle" class="sub">Create tracking record</text><text x="647.5" y="207" text-anchor="middle" dominant-baseline="middle" class="sub">Assign tracking number</text></g><g><path d="M765,180 L805,180" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="805" y="115" width="250" height="130" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="930" y="153" text-anchor="middle" dominant-baseline="middle" class="main">4 • Send + route</text><text x="930" y="180" text-anchor="middle" dominant-baseline="middle" class="sub">Sequential • parallel</text><text x="930" y="207" text-anchor="middle" dominant-baseline="middle" class="sub">or child office route</text></g><g><path d="M1055,180 L1095,180" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="1095" y="115" width="260" height="130" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="1225" y="153" text-anchor="middle" dominant-baseline="middle" class="main">5 • Receive + review</text><text x="1225" y="180" text-anchor="middle" dominant-baseline="middle" class="sub">Office confirms receipt</text><text x="1225" y="207" text-anchor="middle" dominant-baseline="middle" class="sub">then records a decision</text></g><g><path d="M1355,180 L1395,180" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/></g><g><rect x="1395" y="115" width="270" height="130" rx="17" fill="#e5f4ee" stroke="#123f59" stroke-width="2.6"/><text x="1530" y="153" text-anchor="middle" dominant-baseline="middle" class="main">6 • Complete</text><text x="1530" y="180" text-anchor="middle" dominant-baseline="middle" class="sub">Continue route, mark</text><text x="1530" y="207" text-anchor="middle" dominant-baseline="middle" class="sub">Terminal, then archive</text></g><path d="M1225 245 L1225 330 L450 330 L450 380" fill="none" stroke="#1b6680" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="320" y="380" width="260" height="105" rx="17" fill="#fff2d7" stroke="#123f59" stroke-width="2.6"/><text x="450" y="405.5" text-anchor="middle" dominant-baseline="middle" class="main">Changes requested</text><text x="450" y="432.5" text-anchor="middle" dominant-baseline="middle" class="sub">Revise file and</text><text x="450" y="459.5" text-anchor="middle" dominant-baseline="middle" class="sub">resubmit for review</text></g><path d="M1225 245 L1225 330 L880 330 L880 380" fill="none" stroke="#a84450" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="750" y="380" width="260" height="105" rx="17" fill="#fae9eb" stroke="#123f59" stroke-width="2.6"/><text x="880" y="405.5" text-anchor="middle" dominant-baseline="middle" class="main">Rejected</text><text x="880" y="432.5" text-anchor="middle" dominant-baseline="middle" class="sub">Decision is recorded</text><text x="880" y="459.5" text-anchor="middle" dominant-baseline="middle" class="sub">route stops</text></g><path d="M1225 245 L1225 330 L1320 330 L1320 380" fill="none" stroke="#087f8c" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="1190" y="380" width="260" height="105" rx="17" fill="#e5f4ee" stroke="#123f59" stroke-width="2.6"/><text x="1320" y="405.5" text-anchor="middle" dominant-baseline="middle" class="main">Approved</text><text x="1320" y="432.5" text-anchor="middle" dominant-baseline="middle" class="sub">Proceed to next</text><text x="1320" y="459.5" text-anchor="middle" dominant-baseline="middle" class="sub">required route step</text></g><path d="M450 380 L450 300 L380 300 L380 245" fill="none" stroke="#fff2d7" stroke-width="4" marker-end="url(#arrow)"/><g><rect x="70" y="570" width="360" height="115" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="250" y="600.5" text-anchor="middle" dominant-baseline="middle" class="main">QR + signed tracking</text><text x="250" y="627.5" text-anchor="middle" dominant-baseline="middle" class="sub">Public status is limited;</text><text x="250" y="654.5" text-anchor="middle" dominant-baseline="middle" class="sub">OTP gates eligible actions</text></g><g><rect x="480" y="570" width="360" height="115" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="660" y="600.5" text-anchor="middle" dominant-baseline="middle" class="main">Dashboard + work queues</text><text x="660" y="627.5" text-anchor="middle" dominant-baseline="middle" class="sub">Office tasks, archives,</text><text x="660" y="654.5" text-anchor="middle" dominant-baseline="middle" class="sub">and audit history</text></g><g><rect x="890" y="570" width="320" height="115" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="1050" y="600.5" text-anchor="middle" dominant-baseline="middle" class="main">Administration</text><text x="1050" y="627.5" text-anchor="middle" dominant-baseline="middle" class="sub">Users, offices, routes,</text><text x="1050" y="654.5" text-anchor="middle" dominant-baseline="middle" class="sub">reference data, templates</text></g><g><rect x="1260" y="570" width="370" height="115" rx="17" fill="#fff" stroke="#123f59" stroke-width="2.6"/><text x="1445" y="600.5" text-anchor="middle" dominant-baseline="middle" class="main">Connected services</text><text x="1445" y="627.5" text-anchor="middle" dominant-baseline="middle" class="sub">Email + HRIS + configured</text><text x="1445" y="654.5" text-anchor="middle" dominant-baseline="middle" class="sub">DRIP / PDMIS / iPluma</text></g><text x="850" y="802" text-anchor="middle" class="note">Work actions are checked against account, role, office, and route permissions; external services depend on configuration.</text></svg></body></html>
